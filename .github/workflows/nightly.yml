name: Nightly (latest F*)

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install F* nightly
        run: ./setup.sh --nightly

      - name: Show F* version
        run: fstar/bin/fstar.exe --version

      - name: Verify GC code
        id: verify
        continue-on-error: true
        run: |
          set -o pipefail
          make -j$(nproc) 2>&1 | tee verify.log

      - name: Verify SPOT proofs
        id: spot
        continue-on-error: true
        run: |
          set -o pipefail
          make -C spot -j$(nproc) 2>&1 | tee spot.log

      - name: Extract to C
        id: extract
        if: steps.verify.outcome == 'success' && steps.spot.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          make extract 2>&1 | tee extract.log

      - name: Refresh generational snapshot
        id: snapshot
        if: steps.extract.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          make -C generational snapshot 2>&1 | tee snapshot.log

      - name: Build verified_gc runtime
        id: verified_gc_build
        if: steps.snapshot.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          make -C generational/ocaml-integration setup 2>&1 | tee verified_gc_build.log

      - name: Run verified_gc smoke tests
        id: verified_gc_tests
        if: steps.verified_gc_build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          make -C generational/ocaml-integration/tests test \
            OCAMLC="$PWD/generational/ocaml-integration/ocaml-4.14-unchanged/_install/bin/ocamlc" \
            VERIFIED_GEN_OCAMLRUN="$PWD/generational/ocaml-integration/ocaml-4.14-verified-gen/runtime/ocamlrun" \
            UNCHANGED_OCAMLRUN="$PWD/generational/ocaml-integration/ocaml-4.14-unchanged/runtime/ocamlrun" \
            2>&1 | tee verified_gc_tests.log

      - name: Report results
        if: always()
        run: |
          FSTAR_VERSION=$(fstar/bin/fstar.exe --version 2>/dev/null | head -1 || echo "unknown")
          echo "## Nightly F* Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**F* version:** $FSTAR_VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| GC verification | ${{ steps.verify.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SPOT verification | ${{ steps.spot.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Extraction | ${{ steps.extract.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generational snapshot | ${{ steps.snapshot.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| verified_gc build | ${{ steps.verified_gc_build.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| verified_gc tests | ${{ steps.verified_gc_tests.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          summarize_failure() {
            step_name="$1"
            outcome="$2"
            log_file="$3"

            if [ "$outcome" != "success" ] && [ -f "$log_file" ]; then
              echo "<details><summary>$step_name failures</summary>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -E "(Error|error|Warning|warning|Admitted|admitted|failed|Failed)" "$log_file" | tail -100 >> $GITHUB_STEP_SUMMARY || tail -100 "$log_file" >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
              echo "</details>" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          }

          summarize_failure "GC verification" "${{ steps.verify.outcome }}" verify.log
          summarize_failure "SPOT verification" "${{ steps.spot.outcome }}" spot.log
          summarize_failure "Extraction" "${{ steps.extract.outcome }}" extract.log
          summarize_failure "Generational snapshot" "${{ steps.snapshot.outcome }}" snapshot.log
          summarize_failure "verified_gc build" "${{ steps.verified_gc_build.outcome }}" verified_gc_build.log
          summarize_failure "verified_gc tests" "${{ steps.verified_gc_tests.outcome }}" verified_gc_tests.log

      - name: Upload logs
        if: |
          always() && (
            steps.verify.outcome != 'success' ||
            steps.spot.outcome != 'success' ||
            steps.extract.outcome != 'success' ||
            steps.snapshot.outcome != 'success' ||
            steps.verified_gc_build.outcome != 'success' ||
            steps.verified_gc_tests.outcome != 'success'
          )
        uses: actions/upload-artifact@v4
        with:
          name: nightly-logs
          path: |
            verify.log
            spot.log
            extract.log
            snapshot.log
            verified_gc_build.log
            verified_gc_tests.log
          retention-days: 14

      - name: Fail if any step failed
        if: |
          steps.verify.outcome != 'success' ||
          steps.spot.outcome != 'success' ||
          steps.extract.outcome != 'success' ||
          steps.snapshot.outcome != 'success' ||
          steps.verified_gc_build.outcome != 'success' ||
          steps.verified_gc_tests.outcome != 'success'
        run: exit 1
