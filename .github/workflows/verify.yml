name: Verify

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Verification is a multi-hour job. `push` is limited to main so that a push to
# a PR branch does not fire both events and run the whole thing twice, and
# concurrency stops superseded pushes piling up behind each other.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Cache F* toolchain
        id: cache-fstar
        uses: actions/cache@v4
        with:
          path: fstar
          key: fstar-nightly-2026-10-17-linux-x86_64

      - name: Install F*
        if: steps.cache-fstar.outputs.cache-hit != 'true'
        run: ./setup.sh

      - name: Show F* version
        run: fstar/bin/fstar.exe --version

      - name: Verify GC code
        run: make -j$(nproc)

      - name: Verify SPOT proofs
        run: make -C spot -j$(nproc)

      - name: Extract to C
        run: make extract

      - name: Refresh generational snapshot
        run: make -C generational snapshot

      # The OCaml testsuite workflow builds and tests the COMMITTED snapshot,
      # so this is what ties those tests to the verified code: what the proofs
      # extract must be exactly what is committed. Only the KaRaMeL invocation
      # comment differs between machines (it records an absolute path).
      - name: Check the committed snapshot matches the extraction
        run: |
          untracked=$(git ls-files --others --exclude-standard -- generational/snapshot/)
          if ! git diff --quiet -I'KaRaMeL invocation' -- generational/snapshot/ || [ -n "$untracked" ]; then
            echo "::error::generational/snapshot/ does not match what the verified code extracts to. Run 'make extract && make -C generational snapshot' and commit the result."
            git diff --stat -I'KaRaMeL invocation' -- generational/snapshot/
            [ -z "$untracked" ] || printf 'untracked: %s\n' $untracked
            exit 1
          fi
