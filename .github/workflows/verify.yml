name: Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Cache F* toolchain
        id: cache-fstar
        uses: actions/cache@v4
        with:
          path: fstar
          key: fstar-release-v2026.05.17-linux-x86_64

      - name: Install F*
        if: steps.cache-fstar.outputs.cache-hit != 'true'
        run: ./setup.sh

      - name: Show F* version
        run: fstar/bin/fstar.exe --version

      - name: Verify GC code
        run: make -j$(nproc)

      - name: Verify SPOT proofs
        run: make -C spot -j$(nproc)

      - name: Extract to C
        run: make extract

      - name: Refresh generational snapshot
        run: make -C generational snapshot

      - name: Build verified_gc runtime
        run: make -C generational/ocaml-integration setup

      - name: Run verified_gc smoke tests
        run: |
          make -C generational/ocaml-integration/tests test \
            OCAMLC="$PWD/generational/ocaml-integration/ocaml-4.14-unchanged/_install/bin/ocamlc" \
            VERIFIED_GEN_OCAMLRUN="$PWD/generational/ocaml-integration/ocaml-4.14-verified-gen/runtime/ocamlrun" \
            UNCHANGED_OCAMLRUN="$PWD/generational/ocaml-integration/ocaml-4.14-unchanged/runtime/ocamlrun"

  snapshot-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: verify
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Cache F* toolchain
        id: cache-fstar
        uses: actions/cache@v4
        with:
          path: fstar
          key: fstar-release-v2026.05.17-linux-x86_64

      - name: Install F*
        if: steps.cache-fstar.outputs.cache-hit != 'true'
        run: ./setup.sh

      - name: Regenerate snapshots
        run: |
          make -C mark-and-sweep snapshot
          make -C generational snapshot

      - name: Check snapshots are up to date
        run: |
          if ! git diff --quiet -- mark-and-sweep/snapshot/ generational/snapshot/; then
            echo "::warning::Snapshots are out of date. Regenerate and commit them."
            git diff --stat -- mark-and-sweep/snapshot/ generational/snapshot/
          fi
